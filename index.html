<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>XR Industrial Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>

    <!-- ============================= -->
    <!-- ASSETS (Parte D: modelo CAD) -->
    <!-- ============================= -->
    <a-assets>
      <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
    </a-assets>
    <a-entity gltf-model="#modeloIndustrial" position="-10 0 -12" scale="1 1 1"></a-entity>

    <!-- ============================= -->
    <!-- PARTE A: Escena base -->
    <!-- ============================= -->
    <a-box position="0 1 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
    <a-sphere position="2 1 -4" radius="1" color="#EF2D5E"></a-sphere>
    <a-cylinder position="-2 1 -4" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    <a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

    <!-- ============================= -->
    <!-- PARTE C: Sistema industrial con primitivas -->
    <!-- Jerarquía espacial: todo cuelga de una entidad "planta"
         para poder mover/escalar el conjunto completo -->
    <!-- ============================= -->
    <a-entity id="planta-industrial" position="6 0 -6">

      <!-- Piso de la planta -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="8" color="#555555"></a-plane>

      <!-- Estructura / bastidor principal -->
      <a-entity id="estructura" position="0 0 0">
        <a-box position="-4 1.5 -2" width="0.3" height="3" depth="0.3" color="#2b2b2b"></a-box>
        <a-box position="4 1.5 -2" width="0.3" height="3" depth="0.3" color="#2b2b2b"></a-box>
        <a-box position="-4 1.5 2" width="0.3" height="3" depth="0.3" color="#2b2b2b"></a-box>
        <a-box position="4 1.5 2" width="0.3" height="3" depth="0.3" color="#2b2b2b"></a-box>
        <a-box position="0 3 0" width="8.6" height="0.3" depth="4.6" color="#3d3d3d"></a-box>
      </a-entity>

      <!-- Tanque industrial (cilindro grande) con indicador de nivel -->
      <a-entity id="tanque" position="-2.5 0 0">
        <a-cylinder position="0 1.5 0" radius="1" height="3" color="#3A7CA5"></a-cylinder>
        <a-sphere position="0 3.2 0" radius="0.15" color="#FF3333"></a-sphere> <!-- sensor de nivel -->
      </a-entity>

      <!-- Eje / transmisión (cilindro delgado y largo) -->
      <a-entity id="eje-transmision" position="1 1 0" rotation="0 0 90">
        <a-cylinder radius="0.15" height="4" color="#B0B0B0" metalness="0.8" roughness="0.2"></a-cylinder>
      </a-entity>

      <!-- Motor / caja de control -->
      <a-box position="1 0.5 -1.8" width="1" height="1" depth="1" color="#F2A900"></a-box>

      <!-- Sensores indicadores (esferas pequeñas escaladas) -->
      <a-sphere position="1 1.1 -1.8" radius="0.1" scale="1 1 1" color="#39FF14"></a-sphere>
      <a-sphere position="1.3 1.1 -1.8" radius="0.1" scale="1 1 1" color="#FFEE00"></a-sphere>

      <!-- Pared perimetral -->
      <a-plane position="0 1.5 -4" rotation="0 0 0" width="12" height="3" color="#A6C6D9"></a-plane>

    </a-entity>

  </a-scene>
</body>
</html>
